[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekstaat"
version = "0.2.0"
description = "Legt gefactureerde uren naast de orders van de opdrachtgever en de bank, en laat zien waar het niet aansluit."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tim van der Ploeg" }]
requires-python = ">=3.11"
dependencies = ["pandas>=3.0", "openpyxl>=3.1", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17", "formulas>=1.3"]  # formulas: alleen om werkboeken door te rekenen in de tests

[project.scripts]
weekstaat = "weekstaat.cli:main"

[tool.setuptools]
packages = ["weekstaat"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
